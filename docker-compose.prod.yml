# =========================================================================
# 🐳 CRDISK SAAS - PRODUCTION ORCHESTRATION (DOCKER COMPOSE)
# =========================================================================
version: '3.8'

services:
  # 1. Next.js 14 Standalone Web Application & API Engine
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crdisk-app-prod
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-crdisk_db}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crdisk_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/admin/health/logs']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. PostgreSQL 16 com extensão pgvector oficial para busca semântica RAG
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crdisk-postgres-prod
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-crdisk_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - crdisk_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crdisk_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Redis 7 (Alpine) com política allkeys-lru para cache e WebSockets
  redis:
    image: redis:7-alpine
    container_name: crdisk-redis-prod
    restart: always
    command: >
      redis-server 
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru 
      --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_prod_data:/data
    networks:
      - crdisk_network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redispassword}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Nginx Reverse Proxy (SSL, WebSockets & HSTS)
  nginx:
    image: nginx:alpine
    container_name: crdisk-nginx-prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - crdisk_network

  # 5. Certbot Automated SSL Certificate Renewer
  certbot:
    image: certbot/certbot:latest
    container_name: crdisk-certbot-prod
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - crdisk_network

networks:
  crdisk_network:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
