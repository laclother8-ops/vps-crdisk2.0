# =========================================================================
# 🌐 CRDISK SAAS - NGINX REVERSE PROXY & WEBSOCKET GATEWAY CONFIGURATION
# =========================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Upstream Next.js Standalone App Server
upstream app_upstream {
    server app:3000;
    keepalive 64;
}

# 1. Primary HTTP Server (Handles Direct Access & ACME Let's Encrypt Challenge)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt Certbot ACME Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Max Payload Limit for WhatsApp Voice Audio & RAG Documents (25MB)
    client_max_body_size 25M;
    client_body_buffer_size 512k;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Gzip Performance Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Static Assets Fast-Path Caching (Next.js Chunks)
    location /_next/static/ {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public Static Files Fast-Path
    location /public/ {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Real-Time WebSocket Endpoint Proxy (/ws)
    location /ws {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # Main Application & API Proxy
    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
